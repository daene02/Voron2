[gcode_button rkey2]
pin: RHBB: gpio26
press_gcode:
release_gcode:     
  CHANGE_TOOL LANE=lane3
  #SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=2  

[gcode_button rkey3]
pin: RHBB: gpio27
press_gcode:
release_gcode:     
  TOOL_LOAD
  #SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=3 

[gcode_button rkey4]
pin: RHBB: gpio19
press_gcode:
release_gcode:     
  AFC_PARK
  AFC_POOP
  AFC_PARK
  AFC_KICK
  AFC_PARK
  #SET_LED LED=HBB_LED RED=0 GREEN=1 BLUE=0 INDEX=4 

[gcode_button rkey5]
pin: RHBB: gpio18
press_gcode:
release_gcode:     
  M104 S265
  M140 S100
  #SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=5 

[gcode_button rkey6]
pin: RHBB: gpio13
press_gcode:
release_gcode:     
  CHANGE_TOOL LANE=lane2
  #SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=6 

[gcode_button rkey7]
pin: RHBB: gpio12
press_gcode:
release_gcode:
  CHANGE_TOOL LANE=lane1
  # SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=7 

[neopixel RHBB_LED]
pin: RHBB: gpio20
chain_count: 7
color_order: GRB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0.5

[mcu LHBB]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45474E621A85996A-if00

[gcode_button lkey1]
pin: LHBB: gpio25
press_gcode:
release_gcode:     
  LANE_UNLOAD LANE=lane1
 # SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=1  #TRANSMIT=0

[gcode_button lkey2]
pin: LHBB: gpio26
press_gcode:
release_gcode:     
  LANE_UNLOAD LANE=lane2
 # SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=2  

[gcode_button lkey3]
pin: LHBB: gpio27
press_gcode:
release_gcode:   
  RESUME
 # SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=3 

[gcode_button lkey4]
pin: LHBB: gpio19
press_gcode:
  PAUSE
release_gcode:
  # No specific action on release

[gcode_button lkey5]
pin: LHBB: gpio18
press_gcode:
release_gcode:     
  G28
 # SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=5 

[gcode_button lkey6]
pin: LHBB: gpio13
press_gcode:
release_gcode:     
  LANE_UNLOAD LANE=lane3
 # SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=6 

[gcode_button lkey7]
pin: LHBB: gpio12
press_gcode:
release_gcode:
  LANE_UNLOAD LANE=lane4
 # SET_LED LED=LHBB_LED RED=1 GREEN=0 BLUE=0 INDEX=7 

[neopixel LHBB_LED]
pin: LHBB: gpio20
chain_count: 7
color_order: GRB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0.5

[gcode_macro _UPDATE_HOMING_LED]
gcode:
  {% if 'xyz' in printer.toolhead.homed_axes %}
    SET_LED LED=LHBB_LED RED=0 GREEN=1 BLUE=0 INDEX=5  # Green if all axes are homed
  {% else %}
    SET_LED LED=LHBB_LED RED=1 GREEN=0 BLUE=0 INDEX=5  # Red if not all axes are homed
  {% endif %}

[gcode_macro _SET_HOMING_LED_STARTUP_RED]
gcode:
  SET_LED LED=LHBB_LED RED=1 GREEN=0 BLUE=0 INDEX=5

[delayed_gcode set_homing_led_on_startup]
initial_duration: 10.0  # Wait for a short time after startup (adjust as needed)
gcode:
  _SET_HOMING_LED_STARTUP_RED

